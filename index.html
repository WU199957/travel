function icon(color,text,isNum=false){return L.divIcon({className:'',html:`<div style="width:28px;height:28px;border-radius:50%;background:${color};border:2.5px solid #fff;display:flex;align-items:center;justify-content:center;font-size:${isNum?'12px':'14px'};font-weight:700;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.18)">${text}</div>`,iconSize:[28,28],iconAnchor:[14,14]})}
function clearMap(){markers.forEach(m=>map.removeLayer(m));polylines.forEach(p=>map.removeLayer(p));markers=[];polylines=[]}

function showDay(idx){
clearMap();
if(idx===0){
const pts=[];DAYS.forEach(d=>d.locations.forEach(l=>{if(l.lat)pts.push([l.lat,l.lng])}));
Object.values(STATIONS).forEach(s=>pts.push([s.lat,s.lng]));
if(pts.length)map.fitBounds(pts,{padding:[30,30]});
DAYS.slice(1).forEach(d=>{
d.locations.forEach((l,i)=>{if(l.type==='spot'){const num=i+1;const m=L.marker([l.lat,l.lng],{icon:icon(d.color,String(num),true)}).addTo(map).bindPopup(`<b>${num}. ${l.name}</b>`);markers.push(m)}});
});
Object.values(STATIONS).forEach(s=>{const m=L.marker([s.lat,s.lng],{icon:icon('#34c759','🚆')}).addTo(map).bindPopup(`<b>${s.name}</b>`);markers.push(m)});
return}

const day=DAYS.find(d=>d.id===idx);if(!day)return;
const coords=[];
let spotNum=0;
day.locations.forEach(l=>{if(!l.lat)return;
let m;
if(l.type==='spot'){spotNum++;m=L.marker([l.lat,l.lng],{icon:icon(day.color,String(spotNum),true)}).bindPopup(`<b>${spotNum}. ${l.name}</b>`);}
else if(l.type==='station'){m=L.marker([l.lat,l.lng],{icon:icon('#34c759','🚆')}).bindPopup(`<b>${l.name}</b>`);}
else if(l.type==='ferry'){m=L.marker([l.lat,l.lng],{icon:icon('#007aff','⛴️')}).bindPopup(`<b>${l.name}</b>`);}
else if(l.type==='bus'){m=L.marker([l.lat,l.lng],{icon:icon('#ff9500','🚌')}).bindPopup(`<b>${l.name}</b>`);}
else{m=L.marker([l.lat,l.lng],{icon:icon(day.color,'🏨')}).bindPopup(`<b>${l.name}</b>`);}
m.addTo(map);
const gmapQ=l.gmap||encodeURIComponent(l.name);
m.bindPopup(m.getPopup().getContent()+`<br><a href="#" onclick="event.preventDefault();openAS('${l.name.replace(/'/g,"\\'")}',${l.lat},${l.lng},'${gmapQ}')">📍 导航</a>`);
markers.push(m);
if(l.time)coords.push([l.lat,l.lng]);
});

// 添加当天城市的火车站
let station=null;
if(idx===1)station=STATIONS.verona;
else if(idx===2)station=STATIONS.venezia;
else if(idx>=3&&idx<=4)station=STATIONS.roma;
else if(idx===5)station=STATIONS.salerno;
if(station){const sm=L.marker([station.lat,station.lng],{icon:icon('#34c759','🚆')}).addTo(map).bindPopup(`<b>${station.name}</b><br><a href="#" onclick="event.preventDefault();openAS('${station.name.replace(/'/g,"\\'")}',${station.lat},${station.lng},'${station.gmap}')">📍 导航</a>`);markers.push(sm);}

// 添加酒店标记
let hotel=day.locations.find(l=>l.type==='hotel');
if(!hotel&&idx===4)hotel=DAYS[3].locations.find(l=>l.type==='hotel');
if(hotel){const hm=L.marker([hotel.lat,hotel.lng],{icon:icon(day.color,'🏨')}).addTo(map).bindPopup(`<b>${hotel.name}</b><br>${hotel.desc}<br><a href="#" onclick="event.preventDefault();openAS('${hotel.name.replace(/'/g,"\\'")}',${hotel.lat},${hotel.lng},'${hotel.gmap}')">📍 导航</a>`);markers.push(hm);}

if(coords.length>1){const pl=L.polyline(coords,{color:day.color,weight:2.5,opacity:.5,dashArray:'6,5'}).addTo(map);polylines.push(pl)}
if(coords.length)map.fitBounds(coords,{padding:[40,40],maxZoom:14})
}

function locCard(loc,dayIdx,spotIndex,showTravelTime){
const dot=loc.type==='spot'?'spot':loc.type==='hotel'?'hotel':loc.type==='station'?'transport':loc.type==='ferry'?'transport':loc.type==='bus'?'transport':'transport';
const num=loc.type==='spot'?spotIndex:'';
const uid=`d${dayIdx}-${loc.name.replace(/\W/g,'')}`;
const gmapQ=loc.gmap||encodeURIComponent(loc.name);
let lnk=`<button class="btn nav" onclick="openAS('${loc.name.replace(/'/g,"\\'")}',${loc.lat},${loc.lng},'${gmapQ}')">📍 导航</button>`;
if(loc.reserve)lnk+=`<a href="${loc.reserve}" target="_blank" class="btn rsv">📅 预约</a>`;
// 小红书搜索链接
const xhsKeyword=encodeURIComponent(loc.name.replace(/\s+/g,''));
lnk+=`<a href="https://www.xiaohongshu.com/search_result?keyword=${xhsKeyword}" target="_blank" class="btn xhs">🔍 小红书</a>`;
const travelTimeHtml=showTravelTime?`<div style="font-size:12px;color:var(--text-tertiary);margin-top:4px;padding:4px 8px;background:var(--bg-secondary);border-radius:4px;display:inline-block">⏱️ 到下一站: ${loc.travelTime}</div>`:'';
const weatherHtml=loc.lat?`<span class="weather-badge" id="w-${uid}"><span class="w-icon">⏳</span>加载中...</span>`:'';
return`<div class="tl-item"><div class="tl-dot ${dot}">${num}</div><div class="card"><div class="time">${loc.time}${weatherHtml}</div><div class="name">${loc.type==='spot'?spotIndex+'. ':''}${loc.name}</div><div class="desc">${loc.desc}</div>${loc.detail?`<div class="details">${loc.detail.replace(/\n/g,'<br>')}</div>`:''}<div class="links">${lnk}</div>${travelTimeHtml}</div></div>`
}

function renderDay(idx){
const d=DAYS.find(x=>x.id===idx);if(!d)return'';
let h='';
// 火车信息
if(d.train){h+=`<div class="train-info"><div class="label">🚆 火车 ${d.train.note} · ${d.train.duration}</div><div class="route">${d.train.from} → ${d.train.to}</div><div class="time">发车时间: ${d.train.time}</div></div>`;}
h+=`<div class="day-head"><h2>${d.title}</h2><p>${d.date}</p></div>`;
h+='<div class="section-head">行程</div><div class="timeline">';
let spotIndex=0;
d.locations.forEach((l,i)=>{if(l.type==='spot')spotIndex++;const showTravelTime=l.travelTime&&i<d.locations.length-1;h+=locCard(l,idx,l.type==='spot'?spotIndex:null,showTravelTime);});
return h+'</div>'
}

let cur=0;
const tabsEl=document.getElementById('tabs');
const contentEl=document.getElementById('content');
DAYS.forEach(d=>{const btn=document.createElement('button');btn.className='tab'+(d.id===0?' active':'');btn.dataset.day=d.id;btn.textContent=d.label;tabsEl.appendChild(btn)});
function go(idx){cur=idx;tabsEl.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',+t.dataset.day===idx));contentEl.innerHTML=idx===0?overviewContent():renderDay(idx);showDay(idx);contentEl.scrollTo({top:0})}
tabsEl.addEventListener('click',e=>{const t=e.target.closest('.tab');if(t)go(+t.dataset.day)});

const asOverlay=document.createElement('div');asOverlay.className='as-overlay';asOverlay.innerHTML=`<div class="as-sheet"><div class="as-group" id="as-opts"></div><div class="as-group"><button class="as-item as-cancel" onclick="closeAS()">取消</button></div></div>`;document.body.appendChild(asOverlay);asOverlay.addEventListener('click',e=>{if(e.target===asOverlay)closeAS()});
const IS_IOS=/iPad|iPhone|iPod/.test(navigator.userAgent);
function openAS(name,lat,lng,gmap){const q=gmap||encodeURIComponent(name);const encName=encodeURIComponent(name);const appleUrl=IS_IOS?`maps://maps.apple.com/?q=${lat},${lng}&name=${encName}`:`https://maps.apple.com/?q=${lat},${lng}&ll=${lat},${lng}&name=${encName}`;const googleUrl=`https://www.google.com/maps/search/?api=1&query=${q}`;document.getElementById('as-opts').innerHTML=`<button class="as-item" onclick="window.open('${appleUrl}');closeAS()">🍎 Apple Maps</button><button class="as-item" onclick="window.open('${googleUrl}');closeAS()">🗺️ Google Maps</button>`;asOverlay.classList.add('show')}
function closeAS(){asOverlay.classList.remove('show')}

// ╔══════════════════════════════════════════════════════════════╗
// ║  实时天气 - Open-Meteo API                                   ║
// ╚══════════════════════════════════════════════════════════════╝

const WMO_CODES={
0:'☀️',1:'🌤️',2:'⛅',3:'☁️',45:'🌫️',48:'🌫️',
51:'🌦️',53:'🌦️',55:'🌧️',56:'🌧️',57:'🌧️',
61:'🌧️',63:'🌧️',65:'🌧️',66:'🌨️',67:'🌨️',
71:'🌨️',73:'🌨️',75:'🌨️',77:'🌨️',
80:'🌦️',81:'🌧️',82:'🌧️',85:'🌨️',86:'🌨️',
95:'⛈️',96:'⛈️',99:'⛈️'
};

async function fetchWeather(lat,lng,dateStr){
try{
const url=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto`;
const res=await fetch(url);
const data=await res.json();
if(!data.daily)return null;
const idx=data.daily.time.indexOf(dateStr);
if(idx===-1)return null;
return{
code:data.daily.weather_code[idx],
max:Math.round(data.daily.temperature_2m_max[idx]),
min:Math.round(data.daily.temperature_2m_min[idx]),
precip:data.daily.precipitation_probability_max[idx]
};
}catch(e){return null;}
}

function weatherBadge(w){
if(!w)return'';
const icon=WMO_CODES[w.code]||'🌡️';
return`<span class="w-icon">${icon}</span>${w.max}°/${w.min}°`;
}

async function loadDayWeather(dayIdx){
const day=DAYS.find(d=>d.id===dayIdx);
if(!day)return;
const dateMatch=day.date.match(/(\d{1,2})\/(\d{1,2})/);
if(!dateMatch)return;
const month=parseInt(dateMatch[1]);
const dayNum=parseInt(dateMatch[2]);
const year=new Date().getFullYear();
const dateStr=`${year}-${String(month).padStart(2,'0')}-${String(dayNum).padStart(2,'0')}`;

for(const loc of day.locations){
if(!loc.lat)continue;
const uid=`d${dayIdx}-${loc.name.replace(/\W/g,'')}`;
const el=document.getElementById(`w-${uid}`);
if(!el)continue;
const w=await fetchWeather(loc.lat,loc.lng,dateStr);
if(w){
el.innerHTML=weatherBadge(w);
if(w.precip>50)el.style.background='rgba(255,59,48,.1)';
else if(w.precip>30)el.style.background='rgba(255,149,0,.1)';
}else{
el.innerHTML='<span class="w-icon">❓</span>';
}
}
}

// 在 go() 函数中加载天气
const originalGo=go;
go=function(idx){
originalGo(idx);
if(idx!==0)loadDayWeather(idx);
else loadOverviewWeather();
};

go(0);
</script>
